<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OH Timer</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
        color: #f8fafc;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        max-width: 640px;
        width: 100%;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 16px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.18);
        color: #bfdbfe;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1.1;
      }

      p {
        margin: 0 auto 28px;
        max-width: 540px;
        font-size: 1.05rem;
        line-height: 1.7;
        color: #cbd5e1;
      }

      .cta {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 999px;
        background: linear-gradient(90deg, #2563eb, #3b82f6);
        color: white;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
      }

      .cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(59, 130, 246, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Discord Bot</div>
      <h1>OH Reset Timer</h1>
      <p>
        This is a Discord bot I created to track the reset time in Once Human and keep you posted when the next cycle is coming up.
      </p>
      <a
        class="cta"
        href="https://discord.com/oauth2/authorize?client_id=1525736534983311433&permissions=18432&integration_type=0&scope=bot+applications.commands"
        target="_blank"
        rel="noopener noreferrer"
      >
        INVITE THE BOT NOW
      </a>
    </main>
  </body>
</html>
